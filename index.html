<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Gooner Boss Edition</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin: 0 0 5px 0;
            text-shadow: 0 0 8px #ff00ff;
            letter-spacing: 2px;
            font-size: 24px;
            text-align: center;
        }
        #ui-bar {
            width: 90vw;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            margin-bottom: 10px;
            color: #00ffff;
        }
        canvas {
            background-color: #000;
            border: 3px solid #444;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.15);
            max-width: 95vw;
            max-height: 70vh;
        }
        .controls {
            margin-top: 10px;
            font-size: 12px;
            color: #777;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>SPACE INVADERS: THE GOONER EDITION</h1>
    <div id="ui-bar">
        <div>SCORE: <span id="score">0</span></div>
        <div>STAGE: <span id="stage-name">Loading...</span></div>
        <div>LIVES: <span id="lives">3</span></div>
    </div>
    <canvas id="gameCanvas" width="750" height="550"></canvas>
    <div class="controls">Use Arrow Keys / A & D to Move Left & Right<br>Press SPACEBAR to Shoot from Center & Right Guns!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const livesElement = document.getElementById("lives");
        const stageNameElement = document.getElementById("stage-name");

        // Game State
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let victory = false;
        let currentStageIndex = 0;

        // Player Ship Configuration
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 40,
            width: 50,
            height: 18,
            speed: 6,
            color: "#00ff00"
        };

        // Projectiles
        let playerLasers = [];
        let alienLasers = [];
        const laserSpeed = 7;

        // Stage Configuration mapping names and settings
        const stages = [
            { name: "Mass (Weak)", alienName: "mass the gay gooner", color: "#66ccff", hp: 1, rows: 3, cols: 8, speed: 1, weapon: "normal" },
            { name: "George (Medium)", alienName: "George the secret gooner", color: "#ffcc00", hp: 2, rows: 3, cols: 8, speed: 1.2, weapon: "normal" },
            { name: "West (Above Medium)", alienName: "West the og gooner", color: "#ff9933", hp: 3, rows: 4, cols: 8, speed: 1.4, weapon: "normal" },
            { name: "Phantom (Strong)", alienName: "phantom the serial gooner", color: "#ff3333", hp: 4, rows: 4, cols: 8, speed: 1.6, weapon: "normal" },
            { name: "Aura Farmer (Boss)", alienName: "Aura farmer the ultimate gooner", color: "#9933ff", hp: 12, rows: 1, cols: 3, speed: 1.8, weapon: "spread" },
            { name: "Jassy (Finale Boss)", alienName: "Jassy the legendary gooner", color: "#ff00ff", hp: 35, rows: 1, cols: 1, speed: 2.5, weapon: "tracking" }
        ];

        let alienWidth = 70;
        let alienHeight = 45;
        const alienPadding = 15;
        let alienOffsetTop = 50;
        let alienOffsetLeft = 40;

        let aliens = [];
        let alienDirection = 1;
        let currentAlienSpeed = 1;
        const alienDropDistance = 15;
        let alienShootChance = 0.02; 

        // Inputs
        const keys = {};
        document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        // Double laser capability (Center + Right Wing gun)
        let canShoot = true;
        document.addEventListener("keydown", e => {
            if (e.key === " " && canShoot && !gameOver && !victory) {
                playerLasers.push({ x: player.x + player.width / 2 - 2, y: player.y, vx: 0, width: 4, height: 12 });
                playerLasers.push({ x: player.x + player.width - 6, y: player.y, vx: 0, width: 4, height: 12 });
                canShoot = false;
            }
        });
        document.addEventListener("keyup", e => {
            if (e.key === " ") canShoot = true;
        });

        function initStage(index) {
            if (index >= stages.length) {
                victory = true;
                return;
            }
            currentStageIndex = index;
            const currentStage = stages[currentStageIndex];
            stageNameElement.innerText = currentStage.name;
            currentAlienSpeed = currentStage.speed;
            alienDirection = 1;
            playerLasers = [];
            alienLasers = [];

            if (currentStage.weapon === "tracking") {
                alienWidth = 180;
                alienHeight = 70;
                alienOffsetLeft = canvas.width / 2 - 90;
            } else if (currentStage.weapon === "spread") {
                alienWidth = 120;
                alienHeight = 55;
                alienOffsetLeft = 60;
            } else {
                alienWidth = 70;
                alienHeight = 45;
                alienOffsetLeft = 40;
            }

            aliens = [];
            for (let r = 0; r < currentStage.rows; r++) {
                aliens[r] = [];
                for (let c = 0; c < currentStage.cols; c++) {
                    aliens[r][c] = {
                        x: (c * (alienWidth + alienPadding)) + alienOffsetLeft,
                        y: (r * (alienHeight + alienPadding)) + alienOffsetTop,
                        maxHp: currentStage.hp,
                        hp: currentStage.hp,
                        alive: true
                    };
                }
            }
        }

        function rectCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (gameOver || victory) return;

            // Player Movement Left & Right
            if ((keys["arrowleft"] || keys["a"]) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys["arrowright"] || keys["d"]) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Move Player Lasers
            for (let i = playerLasers.length - 1; i >= 0; i--) {
                playerLasers[i].y -= laserSpeed;
                if (playerLasers[i].y < 0) {
                    playerLasers.splice(i, 1);
                }
            }

            // Move Alien Lasers
            for (let i = alienLasers.length - 1; i >= 0; i--) {
                let laser = alienLasers[i];
                laser.y += laserSpeed * 0.6;
                if (laser.vx) {
                    laser.x += laser.vx; // FIXED: Changed laservx to laser.vx
                }
                
                if (laser.y > canvas.height || laser.x < 0 || laser.x > canvas.width) {
                    alienLasers.splice(i, 1);
                    continue;
                }

                if (rectCollision(laser, player)) {
                    alienLasers.splice(i, 1);
                    lives--;
                    livesElement.innerText = lives;
                    if (lives <= 0) gameOver = true;
                }
            }

            // Alien Grid Calculations
            let shiftDown = false;
            let totalAliensAlive = 0;
            const currentStage = stages[currentStageIndex];

            aliens.forEach(row => {
                row.forEach(alien => {
                    if (!alien.alive) return;
                    totalAliensAlive++;

                    alien.x += currentAlienSpeed * alienDirection;

                    if (alien.x + alienWidth > canvas.width - 10 || alien.x < 10) {
                        shiftDown = true;
                    }

                    if (alien.y + alienHeight >= player.y) {
                        gameOver = true;
                    }

                    // Alien Firing Logic
                    if (Math.random() < alienShootChance / totalAliensAlive) {
                        const centerX = alien.x + alienWidth / 2;
                        const bottomY = alien.y + alienHeight;

                        if (currentStage.weapon === "spread") {
                            alienLasers.push({ x: centerX, y: bottomY, vx: -2, width: 6, height: 12 });
                            alienLasers.push({ x: centerX, y: bottomY, vx: 0, width: 6, height: 12 });
                            alienLasers.push({ x: centerX, y: bottomY, vx: 2, width: 6, height: 12 });
                        } else if (currentStage.weapon === "tracking") {
                            const targetDX = (player.x + player.width / 2) - centerX;
                            const targetDY = player.y - bottomY;
                            const distance = Math.sqrt(targetDX * targetDX + targetDY * targetDY);
                            const speedMod = 4; 
                            const calculatedVX = (targetDX / distance) * speedMod;

                            alienLasers.push({ x: centerX, y: bottomY, vx: calculatedVX, width: 8, height: 16 });
