<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Invaders - Gooner Mobile Edition</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none; /* Prevents mobile browser zooming or panning while playing */
            -webkit-user-select: none;
            user-select: none;
        }
        h1 {
            margin: 10px 0 5px 0;
            text-shadow: 0 0 8px #ff00ff;
            letter-spacing: 1px;
            font-size: 18px;
            text-align: center;
        }
        #ui-bar {
            width: 95vw;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 5px;
            color: #00ffff;
        }
        canvas {
            background-color: #000;
            border: 2px solid #444;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.15);
            max-width: 95vw;
            max-height: 55vh;
            display: block;
        }
        /* Mobile Touch Controls Layout */
        #controls-container {
            width: 95vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            margin-bottom: 20px;
        }
        .d-pad {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #fff;
            border-radius: 12px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn:active {
            background: rgba(255, 0, 255, 0.4);
            border-color: #ff00ff;
        }
        .move-btn {
            width: 65px;
            height: 65px;
        }
        .fire-btn {
            width: 120px;
            height: 65px;
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            font-size: 18px;
        }
        .fire-btn:active {
            background: rgba(0, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <h1>SPACE INVADERS: THE GOONER EDITION</h1>
    <div id="ui-bar">
        <div>SCORE: <span id="score">0</span></div>
        <div>STAGE: <span id="stage-name">Loading...</span></div>
        <div>LIVES: <span id="lives">3</span></div>
    </div>
    
    <canvas id="gameCanvas" width="750" height="550"></canvas>

    <!-- Virtual Controls for Mobile Devices -->
    <div id="controls-container">
        <div class="d-pad">
            <div class="btn move-btn" id="leftBtn">◀</div>
            <div class="btn move-btn" id="rightBtn">▶</div>
        </div>
        <div class="btn fire-btn" id="fireBtn">FIRE</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const livesElement = document.getElementById("lives");
        const stageNameElement = document.getElementById("stage-name");

        // Game State
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let victory = false;
        let currentStageIndex = 0;

        // Player Ship Configuration
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 40,
            width: 50,
            height: 18,
            speed: 7,
            color: "#00ff00"
        };

        // Projectiles
        let playerLasers = [];
        let alienLasers = [];
        const laserSpeed = 8;

        // Stage Configuration mapping names and settings
        const stages = [
            { name: "Mass (Weak)", alienName: "mass the gay gooner", color: "#66ccff", hp: 1, rows: 3, cols: 8, speed: 1, weapon: "normal" },
            { name: "George (Medium)", alienName: "George the secret gooner", color: "#ffcc00", hp: 2, rows: 3, cols: 8, speed: 1.2, weapon: "normal" },
            { name: "West (Above Medium)", alienName: "West the og gooner", color: "#ff9933", hp: 3, rows: 4, cols: 8, speed: 1.4, weapon: "normal" },
            { name: "Phantom (Strong)", alienName: "phantom the serial gooner", color: "#ff3333", hp: 4, rows: 4, cols: 8, speed: 1.6, weapon: "normal" },
            { name: "Aura Farmer (Boss)", alienName: "Aura farmer the ultimate gooner", color: "#9933ff", hp: 12, rows: 1, cols: 3, speed: 1.8, weapon: "spread" },
            { name: "Jassy (Finale Boss)", alienName: "Jassy the legendary gooner", color: "#ff00ff", hp: 35, rows: 1, cols: 1, speed: 2.5, weapon: "tracking" }
        ];

        let alienWidth = 70;
        let alienHeight = 45;
        const alienPadding = 15;
        let alienOffsetTop = 50;
        let alienOffsetLeft = 40;

        let aliens = [];
        let alienDirection = 1;
        let currentAlienSpeed = 1;
        const alienDropDistance = 15;
        let alienShootChance = 0.02; 

        // Input tracking states (Combines Keyboards + Touch Controls)
        const inputs = { left: false, right: false };

        // Desktop Keyboard Listeners
        document.addEventListener("keydown", e => {
            const k = e.key.toLowerCase();
            if (k === "arrowleft" || k === "a") inputs.left = true;
            if (k === "arrowright" || k === "d") inputs.right = true;
            if (k === " ") executeFire();
        });
        document.addEventListener("keyup", e => {
            const k = e.key.toLowerCase();
            if (k === "arrowleft" || k === "a") inputs.left = false;
            if (k === "arrowright" || k === "d") inputs.right = false;
        });

        // Mobile On-Screen Button Listeners
        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");
        const fireBtn = document.getElementById("fireBtn");

        leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); inputs.left = true; });
        leftBtn.addEventListener("touchend", (e) => { e.preventDefault(); inputs.left = false; });
        rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); inputs.right = true; });
        rightBtn.addEventListener("touchend", (e) => { e.preventDefault(); inputs.right = false; });
        
        fireBtn.addEventListener("touchstart", (e) => { 
            e.preventDefault(); 
            executeFire(); 
        });

        function executeFire() {
            if (!gameOver && !victory) {
                // Main center laser
                playerLasers.push({ x: player.x + player.width / 2 - 2, y: player.y, vx: 0, width: 4, height: 12 });
                // Right wing laser
                playerLasers.push({ x: player.x + player.width - 6, y: player.y, vx: 0, width: 4, height: 12 });
            } else if (gameOver || victory) {
                // Tap fire button to reset game if finished
                resetGame();
            }
        }

        function initStage(index) {
            if (index >= stages.length) {
                victory = true;
                return;
            }
            currentStageIndex = index;
            const currentStage = stages[currentStageIndex];
            stageNameElement.innerText = currentStage.name;
            currentAlienSpeed = currentStage.speed;
            alienDirection = 1;
            playerLasers = [];
            alienLasers = [];

            if (currentStage.weapon === "tracking") {
                alienWidth = 180;
                alienHeight = 70;
                alienOffsetLeft = canvas.width / 2 - 90;
            } else if (currentStage.weapon === "spread") {
                alienWidth = 120;
                alienHeight = 55;
                alienOffsetLeft = 60;
            } else {
                alienWidth = 70;
                alienHeight = 45;
                alienOffsetLeft = 40;
            }

            aliens = [];
            for (let r = 0; r < currentStage.rows; r++) {
                aliens[r] = [];
                for (let c = 0; c < currentStage.cols; c++) {
                    aliens[r][c] = {
                        x: (c * (alienWidth + alienPadding)) + alienOffsetLeft,
                        y: (r * (alienHeight + alienPadding)) + alienOffsetTop,
                        maxHp: currentStage.hp,
                        hp: currentStage.hp,
                        alive: true
                    };
                }
            }
        }

        function resetGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            victory = false;
            scoreElement.innerText = score;
            livesElement.innerText = lives;
            initStage(0);
        }

        function rectCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (gameOver || victory) return;

            // Player Ship Movement Physics
            if (inputs.left && player.x > 0) {
                player.x -= player.speed;
            }
            if (inputs.right && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Move Player Lasers
